<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <script>
    /* light / dark: the saved choice (or the device setting) is applied before anything paints, so nothing flashes */
    (function () {
      var r = document.documentElement, m = null;
      try { m = localStorage.getItem("twstock-theme"); } catch (e) {}
      if (m !== "light" && m !== "dark") m = null;
      var q = matchMedia("(prefers-color-scheme: light)");
      function eff() { return m || (q.matches ? "light" : "dark"); }
      r.dataset.theme = eff();
      window.__twTheme = {
        get mode() { return m || "system"; },
        set: function (x) {
          m = x === "light" || x === "dark" ? x : null;
          try { m ? localStorage.setItem("twstock-theme", m) : localStorage.removeItem("twstock-theme"); } catch (e) {}
          r.dataset.theme = eff();
        },
      };
      if (q.addEventListener) q.addEventListener("change", function () { if (!m) r.dataset.theme = eff(); });
    })();
  </script>
  <title>TWstock 台股研究</title>
  <style>
    /* Emerald Depth */
    :root {
      --c0: #051F20; --c1: #0B2B26; --c2: #163832; --c3: #235347; --c4: #8EB69B; --c5: #DAF1DE;
      --err: #F0A8A0; --hi: #fff;
      --glow: 142,182,155; --wash: 35,83,71; --flashc: 218,241,222; --sh: 1;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      color-scheme: dark;
    }
    /* the same palette turned over for light mode: pale mint surfaces, the deep greens become the ink */
    :root[data-theme="light"] {
      --c0: #EEF6F0; --c1: #FFFFFF; --c2: #DDEEE2; --c3: #B4D3BF; --c4: #235347; --c5: #051F20;
      --err: #B3382C; --hi: #000;
      --glow: 35,83,71; --wash: 142,182,155; --flashc: 142,182,155; --sh: .3;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; color: var(--c5); transition: background-color .3s, color .3s; font: 16px/1.55 system-ui, -apple-system, "Noto Sans TC", sans-serif;
      background: radial-gradient(900px 500px at 15% -10%, rgba(var(--wash),.5), transparent 70%), var(--c0);
    }
    button, input { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--c4); outline-offset: 2px; }
    .btn { min-height: 40px; padding: 0 16px; border: 1px solid var(--c3); border-radius: 10px; background: var(--c2); cursor: pointer; transition: background .2s, transform .15s; }
    .btn:hover { background: var(--c3); }
    .btn:active { transform: scale(.97); }
    .small { color: var(--c4); font-size: 14px; }

    /* ---------- the page behind the gate (blank for now) ---------- */
    .app header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 68px 14px 16px; border-bottom: 1px solid var(--c2); }
    .app h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
    .app .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .app main { display: grid; place-items: center; min-height: 60vh; padding: 16px; text-align: center; }
    .app main.dashmain { place-items: start center; }

    /* ---------- the gate ---------- */
    #gate {
      position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; overflow: auto;
      padding: 24px max(16px, env(safe-area-inset-left, 0px));
      background-color: var(--c0);
      background-image: radial-gradient(rgba(var(--wash),.7) 1px, transparent 1.3px), radial-gradient(900px 560px at 50% -10%, rgba(var(--wash),.55), transparent 70%);
      background-size: 24px 24px, auto;
      transition: opacity .45s ease, transform .45s ease;
    }
    #gate[hidden] { display: none; }
    #gate.out { opacity: 0; pointer-events: none; }
    .wrap { transition: transform .55s cubic-bezier(.5,0,.8,.4), filter .55s ease, opacity .5s ease; }
    #gate.out .wrap { transform: scale(1.14); filter: blur(10px); opacity: 0; }
    #gate:not(.out) .wrap { transition: transform .85s cubic-bezier(.2,.8,.2,1), filter .55s ease, opacity .6s ease; }
    #gate.hold .wrap { opacity: 0; transform: translateY(28px) scale(.96); }
    .wrap { width: min(100%, 480px); perspective: 1400px; }
    .brand { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--c5); }
    .brand .mk { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: var(--c4); color: var(--c0); font-size: 12px; }

    .ticket {
      position: relative; overflow: hidden; border: 1px solid var(--c3); border-radius: 20px;
      background: radial-gradient(280px circle at var(--mx, 50%) var(--my, 0%), rgba(var(--glow),.17), transparent 70%), var(--c1);
      box-shadow: 0 30px 80px rgba(0,0,0,calc(.5 * var(--sh)));
      transition: transform .32s ease, box-shadow .6s ease, border-color .6s ease;
      animation: cardIn .45s cubic-bezier(.2,.8,.2,1);
    }
    .ticket.flip { transform: rotateY(90deg); }
    .ticket[data-glow="1"] { border-color: var(--c4); animation: glowPulse 1.2s ease-in-out infinite; }
    .ticket::after {
      content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .07; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }
    .main { padding: 26px 26px 20px; min-width: 0; }
    .prompt { font-family: var(--mono); font-size: 12.5px; font-weight: 600; color: var(--c4); }
    .prompt::before { content: "$ "; opacity: .6; }
    .eg-h { font-size: 26px; line-height: 1.2; margin: 6px 0 6px; font-weight: 700; }
    .eg-p { margin: 0 0 18px; color: var(--c4); font-size: 14.5px; }
    .who { color: var(--c5); font-weight: 600; }

    .lab { display: flex; align-items: center; justify-content: space-between; margin: 12px 0 6px; font-size: 13px; color: var(--c4); }
    .eye { display: inline-flex; align-items: center; gap: 5px; border: 0; background: none; color: var(--c4); font-size: 13px; cursor: pointer; padding: 2px 4px; border-radius: 6px; }
    .eye:hover { color: var(--c5); }
    .eye svg { width: 16px; height: 16px; }
    .in {
      width: 100%; min-height: 46px; padding: 0 13px; border: 1px solid var(--c3); border-radius: 12px; background: var(--c0); color: var(--c5);
      transition: border-color .2s, box-shadow .2s;
    }
    .in:focus { outline: none; border-color: var(--c4); box-shadow: 0 0 0 3px rgba(var(--glow),.2); }
    .acct.bad .in, .cells.bad .cell { border-color: var(--err); }
    .acct.bad, .cells.bad { animation: shake .4s; }

    /* which fields each mode shows */
    .reg, .pinrow, .confirm { display: none; }
    [data-mode="register"] .reg { display: block; }
    [data-mode="pin"] .acct, [data-mode="setpin"] .acct { display: none; }
    [data-mode="pin"] .pinrow, [data-mode="setpin"] .pinrow { display: block; }
    [data-mode="setpin"] .confirm { display: block; }
    [data-mode="pin"] .go { display: none; }       /* the four boxes submit by themselves */

    .cells { display: flex; gap: 10px; }
    .cell { flex: 1; }
    .cell input {
      width: 100%; height: 62px; text-align: center; font-size: 26px; font-weight: 600; background: var(--c0);
      border: 1px solid var(--c3); border-radius: 14px; caret-color: var(--c4); padding: 0;
      transition: border-color .2s, box-shadow .2s, transform .2s, background .2s;
    }
    .cell input.mask { -webkit-text-security: disc; }
    .cell input:focus { outline: none; border-color: var(--c4); box-shadow: 0 0 0 4px rgba(var(--glow),.2); transform: translateY(-2px); }
    .cell input.on { border-color: var(--c4); background: var(--c2); }

    .go {
      display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; margin-top: 18px;
      border: 0; border-radius: 12px; background: var(--c4); color: var(--c0); font-weight: 700; cursor: pointer;
      transition: background .2s, transform .15s, gap .2s;
    }
    .go:hover { background: var(--c5); gap: 12px; }
    .go:active { transform: scale(.98); }
    .go:disabled { opacity: .5; cursor: default; }
    .go svg { width: 18px; height: 18px; }
    .msg { min-height: 1.4em; margin: 10px 0 0; font-size: 14px; color: var(--c4); }
    .msg.err { color: var(--err); }
    .links { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 6px; font-size: 14px; color: var(--c4); }
    .link { border: 0; background: none; color: var(--c5); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 2px 0; font-size: inherit; }
    .link:hover { color: var(--hi); }
    .link[hidden] { display: none; }
    .foot { text-align: center; margin: 16px 0 0; font-size: 14px; color: var(--c4); }
    .foot[hidden] { display: none; }

    /* verifying → granted */
    .overlay {
      position: absolute; inset: 0; z-index: 2; display: none; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px; text-align: center; padding: 24px; background: var(--c1);
    }
    .overlay[data-stage] { display: flex; animation: fade .3s ease-out; }
    .overlay h2 { font-size: 22px; margin: 6px 0 0; }
    .overlay p { margin: 0; color: var(--c4); font-size: 14px; }
    .overlay .verify, .overlay .done { display: none; flex-direction: column; align-items: center; gap: 6px; }
    .overlay[data-stage="verify"] .verify { display: flex; }
    .overlay[data-stage="done"] .done { display: flex; }
    .orbitbox { display: none; position: relative; width: 190px; height: 150px; margin-bottom: 8px; }
    .overlay[data-stage="orbit"] .verify { display: flex; }
    .overlay[data-stage="orbit"] .ring { display: none; }
    .overlay[data-stage="orbit"] .orbitbox { display: block; }
    .orbitbox .tile {
      position: absolute; left: 50%; top: 50%; width: 50px; height: 58px; margin: -29px 0 0 -25px; display: grid; place-items: center;
      border-radius: 13px; background: var(--c2); border: 1px solid var(--c4); font-size: 24px; font-weight: 600; color: var(--c5);
      box-shadow: 0 8px 22px rgba(0,0,0,calc(.45 * var(--sh))), 0 0 14px rgba(var(--glow),.25); will-change: transform;
    }
    .orbitbox::before, .orbitbox::after {
      content: ""; position: absolute; left: 50%; top: 50%; border-radius: 50%; border: 1.5px dashed rgba(var(--glow),.45);
    }
    .orbitbox::before { width: 168px; height: 168px; margin: -84px 0 0 -84px; animation: spin 3.4s linear infinite; }
    .orbitbox::after { width: 112px; height: 112px; margin: -56px 0 0 -56px; border-style: dotted; animation: spin 2.2s linear infinite reverse; }
    .orbitbox { background: radial-gradient(circle, rgba(var(--glow),.3), transparent 62%); animation: breathe 1s ease-in-out infinite; }
    .ring { position: relative; width: 104px; height: 104px; margin-bottom: 8px; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring .track { fill: none; stroke: var(--c2); stroke-width: 6; }
    .ring .arc { fill: none; stroke: var(--c4); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 264; stroke-dashoffset: 264; filter: drop-shadow(0 0 6px rgba(var(--glow),.6)); }
    .overlay[data-stage="verify"] .ring { animation: ringPop .55s cubic-bezier(.2,1.5,.4,1); }
    .ring::before { content: ""; position: absolute; inset: -11px; border-radius: 50%; border: 1.5px dashed rgba(var(--glow),.5); animation: spin 7s linear infinite; }
    .ring::after { content: ""; position: absolute; inset: -22px; border-radius: 50%; border: 1px dotted rgba(var(--glow),.3); animation: spin 11s linear infinite reverse; }
    .ring .pct { text-shadow: 0 0 14px rgba(var(--glow),.8); position: absolute; inset: 0; display: grid; place-items: center; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .check { width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 8px;
      background: radial-gradient(circle, var(--c3), var(--c2)); box-shadow: 0 0 0 8px rgba(var(--glow),.12), 0 0 40px rgba(var(--glow),.45); animation: checkPop .5s cubic-bezier(.2,1.4,.4,1); }
    .check svg { width: 46px; height: 46px; fill: none; stroke: var(--c5); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .45s .2s ease-out forwards; }
    .overlay .done h2 { animation: rise .5s .2s both cubic-bezier(.2,.9,.3,1); }
    .overlay .done p { animation: rise .5s .32s both cubic-bezier(.2,.9,.3,1); }
    .overlay .done .badge { animation: badgeIn .6s .45s both cubic-bezier(.2,1.6,.35,1); }
    .shock {
      position: absolute; z-index: 4; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; pointer-events: none;
      border: 2px solid var(--c5); box-shadow: 0 0 24px rgba(var(--glow),.8), inset 0 0 18px rgba(var(--glow),.5);
      animation: shock .8s ease-out forwards;
    }
    .flash { position: absolute; inset: 0; z-index: 4; pointer-events: none; background: radial-gradient(circle at var(--fx) var(--fy), rgba(var(--flashc),.6), transparent 62%); animation: flash .7s ease-out forwards; }
    #fx { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 1200; }
    .badge { margin-top: 8px; padding: 3px 14px; border-radius: 999px; background: var(--c4); color: var(--c0); font-size: 12px; font-weight: 700; letter-spacing: .12em; }

    /* ---------- light / dark button ---------- */
    .theme { position: fixed; top: max(12px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 1010; }
    .themebtn {
      display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--c3);
      background: var(--c1); color: var(--c5); cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,calc(.3 * var(--sh)));
      transition: transform .2s, background .2s, border-color .2s;
    }
    .themebtn:hover { background: var(--c2); border-color: var(--c4); transform: rotate(18deg); }
    .themebtn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .themebtn .moon { display: none; }
    :root[data-theme="dark"] .themebtn .moon { display: block; }
    :root[data-theme="dark"] .themebtn .sun { display: none; }
    .thmenu {
      position: absolute; top: 50px; right: 0; min-width: 150px; padding: 6px; border: 1px solid var(--c3); border-radius: 14px;
      background: var(--c1); box-shadow: 0 18px 50px rgba(0,0,0,calc(.45 * var(--sh)));
      animation: menuIn .18s ease-out; transform-origin: 100% 0;
    }
    .thmenu[hidden] { display: none; }
    .thmenu button { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 38px; padding: 0 12px; border: 0; border-radius: 9px; background: none; color: var(--c5); cursor: pointer; text-align: left; }
    .thmenu button:hover { background: var(--c2); }
    .thmenu button[aria-checked="true"]::after { content: "✓"; color: var(--c4); font-weight: 700; }
    ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
    ::view-transition-old(root) { z-index: 1; }
    ::view-transition-new(root) { z-index: 2; }

    /* ---------- opening intro: a chart draws itself, then an iris opens on the sign-in ---------- */
    .intro { position: fixed; inset: 0; z-index: 1100; overflow: hidden; background: #051F20; color: #DAF1DE; font-family: var(--mono); }
    .intro .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(142,182,155,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(142,182,155,.08) 1px, transparent 1px); background-size: 44px 44px; animation: gridmove 5s linear infinite; }
    .intro svg.chart { position: absolute; inset: 0; width: 100%; height: 100%; }
    .intro .cd { transform-box: fill-box; transform-origin: 50% 100%; }
    .intro .vig { position: absolute; inset: 0; background: radial-gradient(closest-side at 50% 50%, rgba(5,31,32,.88), rgba(5,31,32,.35) 70%, transparent); }
    .intro .center { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 16px; text-align: center; }
    .intro .mk { display: grid; place-items: center; width: 84px; height: 84px; border-radius: 20px; background: #8EB69B; color: #051F20; font: 700 30px var(--mono); box-shadow: 0 0 50px rgba(142,182,155,.55); }
    .intro .ti { font: 700 clamp(34px, 9vw, 60px) var(--mono); min-height: 1.2em; letter-spacing: .02em; color: #DAF1DE; }
    .intro .cur { display: inline-block; width: .08em; height: .9em; margin-left: .06em; vertical-align: -.1em; background: #8EB69B; animation: blink 1s steps(1) infinite; }
    .intro .sub { font-size: 14px; letter-spacing: .5em; color: #8EB69B; padding-left: .5em; }
    .intro .tape { position: absolute; left: 0; right: 0; height: 34px; overflow: hidden; display: flex; align-items: center; border: solid rgba(142,182,155,.25); border-width: 1px 0; background: rgba(11,43,38,.75); font: 600 13px var(--mono); color: #8EB69B; }
    .intro .tape.t { top: 0; }
    .intro .tape.b { bottom: 0; }
    .intro .track { display: flex; gap: 30px; white-space: nowrap; padding-left: 30px; animation: tape 22s linear infinite; }
    .intro .tape.b .track { animation-direction: reverse; }
    .intro .track b { color: #DAF1DE; }
    .intro .sk { position: absolute; left: 0; right: 0; bottom: 52px; text-align: center; font-size: 12px; color: #6f9a85; }
    .irisring { position: fixed; left: 50%; top: 50%; border: 2px solid #8EB69B; border-radius: 50%; transform: translate(-50%, -50%); z-index: 1101; pointer-events: none; box-shadow: 0 0 36px rgba(142,182,155,.8), inset 0 0 36px rgba(142,182,155,.5); }
    @keyframes gridmove { to { background-position: 44px 44px; } }
    @keyframes tape { to { transform: translateX(-50%); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes menuIn { from { opacity: 0; transform: scale(.9) translateY(-6px); } to { opacity: 1; transform: none; } }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
    @keyframes ringPop { from { transform: scale(.3) rotate(-120deg); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes badgeIn { from { opacity: 0; transform: scale(.3) translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes shock { from { transform: scale(.3); opacity: .95; } to { transform: scale(11); opacity: 0; } }
    @keyframes flash { from { opacity: 1; } to { opacity: 0; } }
    @keyframes glowPulse {
      0%,100% { box-shadow: 0 30px 80px rgba(0,0,0,calc(.5 * var(--sh))), 0 0 40px rgba(var(--glow),.3); }
      50% { box-shadow: 0 30px 80px rgba(0,0,0,calc(.5 * var(--sh))), 0 0 90px rgba(var(--glow),.6); }
    }
    @keyframes cardIn { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes shake { 0%,100% { transform: none; } 20% { transform: translateX(-9px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
    @keyframes checkPop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
      .check svg { stroke-dashoffset: 0; }
    }
    @media (max-width: 480px) {
      .main { padding: 22px 18px 16px; }
      .eg-h { font-size: 23px; }
      .cell input { height: 56px; }
    }
  </style>
  <link rel="stylesheet" href="./assets/twdash.css">
</head>
<body>

<!-- light / dark -->
<div class="theme" id="theme">
  <button class="themebtn" id="themeBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="外觀：深色或淺色" title="外觀">
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
  <div class="thmenu" id="themeMenu" role="menu" hidden>
    <button type="button" role="menuitemradio" data-t="system">跟隨裝置</button>
    <button type="button" role="menuitemradio" data-t="light">淺色</button>
    <button type="button" role="menuitemradio" data-t="dark">深色</button>
  </div>
</div>

<!-- the page behind the gate: blank for now -->
<div class="app" id="app">
  <header>
    <h1>TWstock 台股研究</h1>
    <div class="row">
      <span id="who" class="small"></span>
      <button class="btn" id="pinBtn" type="button" hidden>裝置 PIN</button>
      <button class="btn" id="accountBtn" type="button">登出</button>
    </div>
  </header>
  <main class="dashmain">
    <section class="dash" id="dash" aria-label="大盤儀表板">
      <div class="dash-note"><b>示意資料</b>圖表動畫示範，數字不是即時報價。</div>
      <div class="dtabs" role="tablist" aria-label="儀表板分頁">
        <i class="pill"></i>
        <button type="button" role="tab" data-p="dpOverview" aria-selected="true">總覽</button>
        <button type="button" role="tab" data-p="dpTrend" aria-selected="false">走勢</button>
        <button type="button" role="tab" data-p="dpSector" aria-selected="false">產業</button>

<!-- entry gate -->

        <div class="pinrow">
          <div class="lab"><span>PIN 碼</span>
            <button type="button" class="eye" id="eye" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>顯示</span></button>
          </div>
          <div class="cells" data-row="1"></div>
          <div class="confirm">

        <button class="go" type="submit" id="go"><span id="goT"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>

            <div class="pct">0</div>
          </div>

<canvas id="fx" aria-hidden="true"></canvas>

<script src="./assets/twaccount.js"></script>
<script src="./assets/twdash.js"></script>
<script>
(function () {
  const A = window.TWAccount;
  const $ = s => document.querySelector(s);
  const gate = $("#gate"), ticket = $("#ticket"), overlay = ticket.querySelector(".overlay");
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const PIN_MODES = ["pin", "setpin"];
  let opts = {}, busy = false, autoT = null, introOn = false;

  const TEXT = {
    login:    { prompt: "twstock --login", h: "登入", p: "輸入帳號名稱和密碼，就會載入你的自選股。", btn: "登入", sw: "還沒有帳號？", swb: "註冊", alt: "" },
    register: { prompt: "twstock --new", h: "建立帳號", p: "自己取一個帳號名稱和密碼。這裡沒有 Email，所以忘記密碼就找不回來，請記好。帳號和 EZexams 通用。", btn: "註冊並進入", sw: "已經有帳號？", swb: "登入", alt: "" },
    pin:      { prompt: "twstock --pin", h: "輸入 PIN 碼", p: "", btn: "進入 TWstock", sw: "", swb: "改用密碼登入", alt: "換成別的帳號" },
    setpin:   { prompt: "twstock --pin set", h: "設定這台裝置的 PIN 碼", p: "設好之後，這台裝置只要輸入 4 位數 PIN 碼就能登入，不用再打密碼。PIN 碼只對這台裝置有效，錯 5 次就會失效。避開 1234、0000 這種好猜的。", btn: "設定", sw: "", swb: "", alt: "先不設定" },
  };
  const LABELS = {
    login:    { verify: ["驗證中…", "正在安全地確認你的身分"], done: ["登入成功", "歡迎回來"] },
    register: { verify: ["建立帳號中…", "請稍候"], done: ["註冊成功", "已為你登入"] },
    pinset:   { verify: ["設定中…", "正在記住這台裝置"], done: ["PIN 已設定", "下次用 PIN 就能登入"] },
  };

  /* ---------- the PIN boxes ---------- */
  const MASK = !!(window.CSS && CSS.supports && CSS.supports("-webkit-text-security", "disc"));
  const cellsets = [...ticket.querySelectorAll(".cells")];
  const cells = g => [...g.querySelectorAll("input")];
  const val = g => cells(g).map(x => x.value).join("");
  cellsets.forEach((g, gi) => {
    g.innerHTML = [1, 2, 3, 4].map(i =>
      '<div class="cell"><input type="' + (MASK ? "text" : "password") + '" class="' + (MASK ? "mask" : "") +
      '" inputmode="numeric" pattern="[0-9]*" enterkeyhint="go" maxlength="1" autocomplete="off" aria-label="PIN 碼第 ' + i + ' 位"></div>').join("");
    cells(g).forEach((x, i) => {
      x.addEventListener("input", () => {
        const d = x.value.replace(/\D/g, "");
        x.value = ""; x.classList.remove("on"); g.classList.remove("bad");
        if (d) fill(g, i, d, gi);
      });
      x.addEventListener("keydown", e => {
        const c = cells(g);
        if (e.key === "Backspace" && !x.value && i > 0) { e.preventDefault(); c[i - 1].value = ""; c[i - 1].classList.remove("on"); c[i - 1].focus(); }
        else if (e.key === "ArrowLeft" && i > 0) c[i - 1].focus();
        else if (e.key === "ArrowRight" && i < 3) c[i + 1].focus();
      });
      x.addEventListener("paste", e => {
        const d = (e.clipboardData || window.clipboardData).getData("text").replace(/\D/g, "");
        if (d) { e.preventDefault(); fill(g, i, d, gi); }
      });
      x.addEventListener("focus", () => x.select());
    });
  });
  function fill(g, from, digits, gi) {
    const c = cells(g);
    let i = from;
    for (const d of digits) {
      if (i >= 4) break;
      c[i].value = d; c[i].classList.add("on");
      const [bx, by] = rectCenter(c[i]);
      spawn(bx, by, 10, Object.assign({ v0: 30, v1: 150, l0: .3, l1: .6, s0: 1, s1: 2.4, c: ["#8EB69B", "#DAF1DE"], drag: .9 }, FULL));
      i++;
    }
    if (i >= 4 && gi === 0 && ticket.dataset.mode === "setpin") cells(cellsets[1])[0].focus();
    else c[Math.min(i, 3)].focus();
    clearTimeout(autoT);
    autoT = setTimeout(auto, 140);
  }
  /* no Enter needed: as soon as every box is filled, the code is checked */
  function auto() {
    const m = ticket.dataset.mode;
    if (busy || gate.hidden || !PIN_MODES.includes(m)) return;
    if (val(cellsets[0]).length < 4) return;
    if (m === "setpin" && val(cellsets[1]).length < 4) return;
    ticket.requestSubmit();
  }
  function clearCells() {
    cellsets.forEach(g => cells(g).forEach(x => { x.value = ""; x.classList.remove("on"); }));
  }
  /* ---------- show / hide ---------- */
  function toggleEye(btn, apply) {
    btn.addEventListener("click", () => {
      const on = btn.getAttribute("aria-pressed") !== "true";
      btn.setAttribute("aria-pressed", on);
      btn.querySelector("span").textContent = on ? "隱藏" : "顯示";
      apply(on);
    });
  }
  toggleEye($("#eye"), on => ticket.querySelectorAll(".cell input").forEach(x => {
    if (MASK) x.classList.toggle("mask", !on); else x.type = on ? "text" : "password";
  }));
  toggleEye($("#eyeP"), on => ["#pass", "#pass2"].forEach(i => { $(i).type = on ? "text" : "password"; }));

  /* ---------- messages and modes ---------- */
  function say(t, cls) { const m = $("#msg"); m.className = "msg" + (cls ? " " + cls : ""); m.textContent = t || ""; }
  /* a rejected entry: shake, say why, then (for PINs) empty the boxes so the next try starts at the first box */
  function bad(el, t) {
    el.classList.remove("bad"); void el.offsetWidth; el.classList.add("bad");
    say(t, "err");
    if (PIN_MODES.includes(ticket.dataset.mode)) {
      const [bx, by] = rectCenter(cellsets[0]);
      spawn(bx, by, 26, Object.assign({ v0: 60, v1: 260, l0: .4, l1: .8, s0: 1.2, s1: 3, c: ["#F0A8A0", "#ff8c82"], drag: .92 }, FULL));
      setTimeout(() => { clearCells(); try { cells(cellsets[0])[0].focus(); } catch (e) {} }, 380);
    }
  }
  function focusFirst() {
    if (introOn || gate.hidden) return;
    const m = ticket.dataset.mode;
    try { (PIN_MODES.includes(m) ? cells(cellsets[0])[0] : ($("#user").value ? $("#pass") : $("#user"))).focus(); } catch (e) {}
  }
  function setMode(m, animate, msg) {
    const apply = () => {
      delete overlay.dataset.stage; delete ticket.dataset.glow;
      ticket.dataset.mode = m;
      const t = TEXT[m], dv = A.device();
      $("#egPrompt").textContent = t.prompt;
      $("#egH").textContent = t.h;
      const p = $("#egP");
      p.textContent = t.p;
      if (m === "pin") {
        p.textContent = "歡迎回來，";
        const b = document.createElement("span");
        b.className = "who"; b.textContent = dv ? dv.username : "";
        p.append(b, "。輸入這台裝置的 PIN 碼。");
      }
      $("#goT").textContent = t.btn;
      $("#swT").textContent = t.sw;
      $("#sw").textContent = t.swb; $("#sw").hidden = !t.swb;
      const alt = $("#alt");
      alt.textContent = opts.change && m === "setpin" ? "取消" : t.alt;
      alt.hidden = !alt.textContent;
      $("#foot").hidden = m === "setpin" || !!opts.change;
      clearCells();
      cellsets.forEach(g => g.classList.remove("bad"));
      ["#pass", "#pass2"].forEach(i => { $(i).value = ""; });
      $(".acct").classList.remove("bad");
      if (m === "login" && dv && !$("#user").value) $("#user").value = dv.username;
      if (m === "register") $("#user").value = "";
      say(msg || "", msg ? "err" : "");
      setTimeout(focusFirst, 30);
    };
    if (!animate || reduced) { apply(); return; }
    ticket.classList.add("flip");
    setTimeout(() => { apply(); ticket.classList.remove("flip"); }, 320);
  }
  $("#sw").addEventListener("click", () => setMode(ticket.dataset.mode === "login" ? "register" : "login", true));
  $("#alt").addEventListener("click", () => {
    const m = ticket.dataset.mode;
    if (m === "pin") { A.forgetDevice(); $("#user").value = ""; setMode("login", true); }
    else if (m === "setpin") { A.markPinAsked(); closeGate(); }
  });
  $("#skip").addEventListener("click", () => {
    try { sessionStorage.setItem("twgate-skip", "1"); } catch (e) {}
    closeGate();
  });
  ["#user", "#pass", "#pass2"].forEach(i => $(i).addEventListener("input", () => $(".acct").classList.remove("bad")));

  /* pointer light */
  ticket.addEventListener("pointermove", e => {
    const r = ticket.getBoundingClientRect();
    ticket.style.setProperty("--mx", (e.clientX - r.left) + "px");
    ticket.style.setProperty("--my", (e.clientY - r.top) + "px");
  });

  /* ---------- particles: one canvas over the whole page, so confetti can leave the card ---------- */
  const fx = $("#fx"), g = fx.getContext("2d");
  const FULL = { a0: 0, a1: 6.283 };
  const GREENS = ["#235347", "#8EB69B", "#DAF1DE", "#ffffff"];
  /* on the light theme the pale sparks would vanish, so they are swapped for deeper greens (and drawn normally, not added) */
  const isLight = () => document.documentElement.dataset.theme === "light";
  const LMAP = { "#DAF1DE": "#235347", "#ffffff": "#4f8a6e", "#b9e4c6": "#3f7a62", "#8EB69B": "#2f6b57", "#F0A8A0": "#C0463A", "#ff8c82": "#D9534A" };
  let P = [], fxRaf = 0, fxLast = 0;
  function sizeFx() { const d = Math.min(devicePixelRatio || 1, 2); fx.width = innerWidth * d; fx.height = innerHeight * d; g.setTransform(d, 0, 0, d, 0, 0); }
  addEventListener("resize", sizeFx);
  sizeFx();
  function spawn(x, y, n, o) {
    if (reduced) return;
    const light = isLight() && o.force !== "dark";
    for (let i = 0; i < n; i++) {
      const a = o.a0 + Math.random() * (o.a1 - o.a0), sp = o.v0 + Math.random() * (o.v1 - o.v0);
      P.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: o.g || 0, drag: o.drag || .96, life: 0,
        max: o.l0 + Math.random() * (o.l1 - o.l0), s: o.s0 + Math.random() * (o.s1 - o.s0),
        c: (() => { const c = o.c[(Math.random() * o.c.length) | 0]; return light ? (LMAP[c] || c) : c; })(), add: !light, rect: !!o.rect && Math.random() < .65, r: Math.random() * 6.3, vr: (Math.random() - .5) * 14 });
    }
    if (!fxRaf) fxRaf = requestAnimationFrame(fxFrame);
  }
  function fxFrame(now) {
    const dt = Math.min((now - (fxLast || now)) / 1000, .05);
    fxLast = now;
    g.clearRect(0, 0, innerWidth, innerHeight);
    P = P.filter(p => {
      p.life += dt;
      if (p.life >= p.max) return false;
      const dr = Math.pow(p.drag, dt * 60);
      p.vx *= dr; p.vy = p.vy * dr + p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      const k = 1 - p.life / p.max;
      g.globalAlpha = Math.min(1, k * 1.8);
      g.fillStyle = p.c;
      g.globalCompositeOperation = p.add ? "lighter" : "source-over";
      g.save(); g.translate(p.x, p.y); g.rotate(p.r);
      if (p.rect) g.fillRect(-p.s, -p.s * .5, p.s * 2, p.s);
      else { g.beginPath(); g.arc(0, 0, Math.max(.4, p.s * (.4 + k * .6)), 0, 6.283); g.fill(); }
      g.restore();
      return true;
    });
    g.globalAlpha = 1;
    if (P.length) fxRaf = requestAnimationFrame(fxFrame);
    else { fxRaf = 0; fxLast = 0; g.clearRect(0, 0, innerWidth, innerHeight); }
  }
  const rectCenter = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
  function shock(x, y) {
    if (reduced) return;
    const r = ticket.getBoundingClientRect(), d = document.createElement("div");
    d.className = "shock"; d.style.left = (x - r.left) + "px"; d.style.top = (y - r.top) + "px";
    overlay.append(d);
    d.addEventListener("animationend", () => d.remove());
  }
  function flash(x, y) {
    if (reduced) return;
    const r = ticket.getBoundingClientRect(), d = document.createElement("div");
    d.className = "flash"; d.style.setProperty("--fx", (x - r.left) + "px"); d.style.setProperty("--fy", (y - r.top) + "px");
    overlay.append(d);
    d.addEventListener("animationend", () => d.remove());
  }
  function pulseCard() {
    if (!reduced) ticket.animate([{ transform: "scale(1)" }, { transform: "scale(1.04)", offset: .35 }, { transform: "scale(1)" }], { duration: 440, easing: "ease-out" });
  }

  /* ---------- verifying → granted ---------- */
  /* four tiles speed up around the middle of the card, leaving sparks; then they spiral in and burst */
  function startOrbit(glyphs) {
    const box = overlay.querySelector(".orbitbox");
    box.innerHTML = "";
    const tiles = Array.from(glyphs).map(d => { const t = document.createElement("div"); t.className = "tile"; t.textContent = d; box.append(t); return t; });
    const [cx, cy] = rectCenter(box);
    const t0 = performance.now();
    let on = true, collapseAt = 0, finished = null;
    (function frame(now) {
      if (!on) return;
      const t = (now - t0) / 1000, k = Math.min(t / .55, 1), ease = 1 - Math.pow(1 - k, 3);
      let R = 56 + 120 * (1 - ease), sc = 1 + .1 * Math.sin(t * 9), ang = 3 * t + 4.2 * t * t;   /* faster and faster */
      if (collapseAt) {
        const c = Math.min((now - collapseAt) / 380, 1);
        R *= 1 - c * c; sc = 1 - .75 * c; ang += 10 * c;
        if (c >= 1) { on = false; box.innerHTML = ""; if (finished) finished(); return; }
      }
      tiles.forEach((el, i) => {
        const a = i * Math.PI / 2 + ang, x = Math.cos(a) * R * 1.18, y = Math.sin(a) * R * .8;
        el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) rotate(" + (16 * Math.sin(t * 3 + i * 1.7)).toFixed(1) + "deg) scale(" + sc.toFixed(2) + ")";
        spawn(cx + x, cy + y, 1, Object.assign({ v0: 8, v1: 45, l0: .3, l1: .65, s0: 1, s1: 2.6, c: ["#8EB69B", "#DAF1DE"], drag: .93 }, FULL));
      });
      requestAnimationFrame(frame);
    })(t0);
    return {
      cx, cy,
      stop() { on = false; },
      collapse() { return new Promise(r => { finished = r; collapseAt = performance.now(); }); },
    };
  }
  async function run(labels, fn, glyphs) {
    const arc = overlay.querySelector(".arc"), pct = overlay.querySelector(".pct"), ring = overlay.querySelector(".ring");
    $("#vT").textContent = labels.verify[0]; $("#vS").textContent = labels.verify[1];
    $("#dT").textContent = labels.done[0]; $("#dS").textContent = labels.done[1];
    const setPct = p => { pct.textContent = Math.round(p); arc.style.strokeDashoffset = 264 * (1 - p / 100); };
    busy = true;
    const req = fn();                                  /* the request starts right away, the show runs beside it */
    req.catch(() => {});
    let running = false, orb = null;
    try {
      if (glyphs && !reduced) {
        overlay.dataset.stage = "orbit";
        orb = startOrbit(glyphs);
        await sleep(1200);
        await orb.collapse();
        spawn(orb.cx, orb.cy, 80, Object.assign({ v0: 120, v1: 440, l0: .5, l1: 1.1, s0: 1.2, s1: 3.2, c: GREENS, drag: .93 }, FULL));
        shock(orb.cx, orb.cy); flash(orb.cx, orb.cy); pulseCard();
      }
      overlay.dataset.stage = "verify";
      let p = 0, target = 88, k = 0.05;
      running = true;
      setPct(0);
      (function tick() {
        if (!running) return;
        p += (target - p) * k;
        setPct(p);
        if (p > 1 && p < 99.5) {                       /* sparks fly off the head of the arc */
          const r = ring.getBoundingClientRect(), a = p / 100 * 6.283 - 1.5708, rad = 42 * r.width / 104;
          spawn(r.left + r.width / 2 + Math.cos(a) * rad, r.top + r.height / 2 + Math.sin(a) * rad, 2,
            { a0: a - .7, a1: a + .7, v0: 40, v1: 150, l0: .3, l1: .6, s0: .8, s1: 2.2, c: ["#8EB69B", "#DAF1DE"], drag: .92 });
        }
        requestAnimationFrame(tick);
      })();
      const res = await req;
      target = 100; k = 0.22;                        /* the request is back: run the ring up to 100 */
      const t0 = performance.now();
      while (p < 99.4 && performance.now() - t0 < 1000) await new Promise(requestAnimationFrame);
      running = false; setPct(100);
      overlay.dataset.stage = "done"; ticket.dataset.glow = "1";
      await new Promise(requestAnimationFrame);
      const [kx, ky] = rectCenter(overlay.querySelector(".check"));
      spawn(kx, ky, 140, { a0: 0, a1: 6.283, v0: 160, v1: 660, g: 540, drag: .975, l0: 1.1, l1: 2.3, s0: 2.5, s1: 5.5, c: GREENS.concat("#b9e4c6"), rect: true });
      spawn(kx, ky, 40, Object.assign({ v0: 80, v1: 380, l0: .5, l1: 1, s0: 1, s1: 2.5, c: ["#DAF1DE", "#ffffff"], drag: .93 }, FULL));
      shock(kx, ky); setTimeout(() => shock(kx, ky), 170); flash(kx, ky); pulseCard();
      await sleep(reduced ? 500 : 1600);
      return res;
    } catch (err) {
      running = false;
      if (orb) orb.stop();
      delete overlay.dataset.stage;
      throw err;
    } finally {
      busy = false;
    }
  }

  /* ---------- submit ---------- */
  ticket.addEventListener("submit", async e => {
    e.preventDefault();
    if (busy) return;
    const m = ticket.dataset.mode;
    say("");
    try {
      if (m === "login" || m === "register") {
        const u = $("#user").value.trim(), p = $("#pass").value;
        if (!u || !p) return bad($(".acct"), "請輸入帳號名稱和密碼。");
        if (m === "register" && p !== $("#pass2").value) return bad($(".acct"), "兩次輸入的密碼不一樣。");
        await run(m === "login" ? LABELS.login : LABELS.register, () => m === "login" ? A.signIn(u, p) : A.signUp(u, p), ["T", "W", "$", "↗"]);
        const d = A.device();
        if (d && !d.pin && !d.asked) setMode("setpin", true); else closeGate();
      } else if (m === "pin") {
        const pin = val(cellsets[0]);
        if (pin.length < 4) return bad(cellsets[0], "請輸入 4 位數的 PIN 碼。");
        await run(LABELS.login, () => A.pinLogin(pin), pin);
        closeGate();
      } else if (m === "setpin") {
        const a = val(cellsets[0]), b = val(cellsets[1]);
        if (a.length < 4 || b.length < 4) return bad(cellsets[0], "請輸入 4 位數的 PIN 碼。");
        if (a !== b) return bad(cellsets[1], "兩次輸入的 PIN 碼不一樣。");
        await run(LABELS.pinset, () => A.setPin(a), ["●", "●", "●", "●"]);
        closeGate();
      }
    } catch (err) {
      if (!err.code) console.warn("[TWstock]", err);   /* an unexpected error: leave a trace for debugging */
      if (m === "pin") {
        bad(cellsets[0], A.errMsg(err));
        if (err.code === "nopin" || err.code === "pinlocked") setTimeout(() => setMode("login", true, A.errMsg(err)), 1200);
      } else if (m === "setpin") bad(cellsets[0], A.errMsg(err));
      else bad($(".acct"), A.errMsg(err));
    }
  });

  /* ---------- light / dark ---------- */
  (function () {
    const T = window.__twTheme, btn = $("#themeBtn"), menu = $("#themeMenu");
    const mark = () => menu.querySelectorAll("[data-t]").forEach(b => b.setAttribute("aria-checked", String(b.dataset.t === T.mode)));
    const close = () => { menu.hidden = true; btn.setAttribute("aria-expanded", "false"); };
    mark();
    btn.addEventListener("click", e => {
      e.stopPropagation();
      menu.hidden = !menu.hidden;
      btn.setAttribute("aria-expanded", String(!menu.hidden));
    });
    document.addEventListener("click", e => { if (!menu.hidden && !e.target.closest("#theme")) close(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape" && !menu.hidden) { close(); btn.focus(); } });
    menu.addEventListener("click", e => {
      const b = e.target.closest("[data-t]");
      if (!b) return;
      const apply = () => { T.set(b.dataset.t); mark(); };
      close();
      if (!document.startViewTransition || reduced) { apply(); return; }
      /* the new theme grows out of the button as a circle */
      const r = btn.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
      const end = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
      const vt = document.startViewTransition(apply);
      vt.ready.then(() => document.documentElement.animate(
        { clipPath: ["circle(0px at " + x + "px " + y + "px)", "circle(" + end + "px at " + x + "px " + y + "px)"] },
        { duration: 650, easing: "ease-in-out", pseudoElement: "::view-transition-new(root)" })).catch(() => {});
    });
  })();

  /* ---------- opening intro: a stock chart draws itself, the name types out, an iris opens on the sign-in ---------- */
  function playIntro() {
    const W = innerWidth, H = innerHeight;
    const el = document.createElement("div");
    el.className = "intro"; el.setAttribute("aria-hidden", "true");
    let seed = 20261029;                                   /* the same chart every time */
    const rnd = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const N = Math.max(12, Math.min(44, Math.round(W / 34)));
    const top = H * .22, bot = H * .8;
    const cs = []; let price = 0;
    for (let i = 0; i < N; i++) {
      const o = price, c = o + (rnd() - .4) + .12;
      cs.push({ o, c, hi: Math.max(o, c) + rnd() * .5, lo: Math.min(o, c) - rnd() * .5 });
      price = c;
    }
    const lo = Math.min(...cs.map(c => c.lo)), hi = Math.max(...cs.map(c => c.hi));
    const Y = v => bot - (v - lo) / (hi - lo) * (bot - top);
    const step = W / (N + 1), cw = Math.max(5, step * .5);
    let candles = "", pts = "";
    cs.forEach((c, i) => {
      const x = step * (i + 1), up = c.c >= c.o, col = up ? "#8EB69B" : "#2c6354";
      candles += '<g class="cd"><line x1="' + x + '" x2="' + x + '" y1="' + Y(c.hi) + '" y2="' + Y(c.lo) + '" stroke="' + (up ? "#8EB69B" : "#4f8a6e") + '" stroke-width="1.6"/>' +
        '<rect x="' + (x - cw / 2) + '" y="' + Y(Math.max(c.o, c.c)) + '" width="' + cw + '" height="' + Math.max(2, Math.abs(Y(c.o) - Y(c.c))) + '" rx="2" fill="' + col + '" stroke="#8EB69B" stroke-opacity=".5"/></g>';
      pts += (i ? "L" : "M") + x + " " + Y(c.c);
    });
    const codes = [["2330", "台積電"], ["2317", "鴻海"], ["2454", "聯發科"], ["2412", "中華電"], ["2881", "富邦金"], ["2882", "國泰金"], ["2603", "長榮"], ["0050", "元大台灣50"], ["2308", "台達電"], ["2891", "中信金"]];
    const tape = off => { const one = codes.map((c, i) => "<span>" + c[0] + " " + c[1] + " <b>" + ((i + off) % 3 ? "▲" : "▼") + "</b></span>").join(""); return '<div class="track">' + one + one + one + one + '</div>'; };
    el.innerHTML = '<div class="grid"></div>' +
      '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '">' + candles +
      '<path class="ln" d="' + pts + '" fill="none" stroke="#DAF1DE" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 6px #8EB69B)"/>' +
      '<circle class="dot" r="6" fill="#DAF1DE" style="filter:drop-shadow(0 0 8px #8EB69B)" opacity="0"/></svg>' +
      '<div class="vig"></div>' +
      '<div class="tape t">' + tape(0) + '</div><div class="tape b">' + tape(1) + '</div>' +
      '<div class="center"><div class="mk">TW</div><div class="ti"><span class="tx"></span><i class="cur"></i></div><div class="sub">台股研究</div></div>' +
      '<div class="sk">點一下跳過</div>';
    document.body.appendChild(el);

    /* candles grow one after another */
    el.querySelectorAll(".cd").forEach((g, i) => g.animate(
      [{ transform: "scaleY(0)", opacity: 0 }, { transform: "scaleY(1.08)", opacity: 1, offset: .7 }, { transform: "scaleY(1)", opacity: 1 }],
      { duration: 460, delay: 80 + i * (1000 / N), easing: "cubic-bezier(.2,1,.4,1)", fill: "both" }));
    /* the closing-price line is traced after them, a bright dot at its head throwing sparks */
    const ln = el.querySelector(".ln"), dot = el.querySelector(".dot"), L = ln.getTotalLength();
    ln.style.strokeDasharray = L; ln.style.strokeDashoffset = L;
    const T0 = performance.now(), T_LINE = 650, D_LINE = 1200;
    let closed = false;
    (function trace(now) {
      if (closed) return;
      const k = Math.min(Math.max((now - T0 - T_LINE) / D_LINE, 0), 1), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      ln.style.strokeDashoffset = L * (1 - e);
      if (k > 0 && k < 1) {
        const pt = ln.getPointAtLength(L * e);
        dot.setAttribute("cx", pt.x); dot.setAttribute("cy", pt.y); dot.setAttribute("opacity", "1");
        spawn(pt.x, pt.y, 2, Object.assign({ v0: 20, v1: 110, l0: .3, l1: .7, s0: 1, s1: 2.4, c: ["#8EB69B", "#DAF1DE"], drag: .92, force: "dark" }, FULL));
      } else if (k >= 1) dot.setAttribute("opacity", "0");
      if (k < 1 || now - T0 < T_LINE + D_LINE + 50) requestAnimationFrame(trace);
    })(T0);

    /* the mark pops, the name types itself out */
    const mk = el.querySelector(".mk"), tx = el.querySelector(".tx"), sub = el.querySelector(".sub"), sk = el.querySelector(".sk"), C = el.querySelector(".center");
    mk.animate([{ transform: "scale(.3)", opacity: 0 }, { transform: "scale(1.18)", opacity: 1, offset: .6 }, { transform: "scale(1)", opacity: 1 }],
      { duration: 620, delay: 1000, easing: "cubic-bezier(.3,1.3,.5,1)", fill: "both" });
    setTimeout(() => { if (!closed) { const [mx, my] = rectCenter(mk); spawn(mx, my, 46, Object.assign({ v0: 80, v1: 360, l0: .5, l1: 1, s0: 1.2, s1: 3, c: GREENS, drag: .93, force: "dark" }, FULL)); } }, 1150);
    "TWstock".split("").forEach((ch, i) => setTimeout(() => { if (!closed) tx.textContent += ch; }, 1550 + i * 85));
    sub.animate([{ opacity: 0, letterSpacing: "1.3em" }, { opacity: 1, letterSpacing: ".5em" }], { duration: 700, delay: 2200, easing: "ease-out", fill: "both" });
    sk.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 600, delay: 500, fill: "both" });

    /* the way out: a circle opens from the middle and the sign-in card rises into it */
    const ring = document.createElement("div");
    ring.className = "irisring"; ring.style.opacity = "0";
    document.body.appendChild(ring);
    function reveal() {
      if (closed) return;
      closed = true;
      document.removeEventListener("keydown", onKey);
      gate.classList.remove("hold");
      C.animate([{ transform: "none", opacity: 1 }, { transform: "scale(1.5)", opacity: 0 }], { duration: 520, easing: "ease-in", fill: "forwards" });
      sk.remove();
      const R = Math.hypot(W, H) / 2 + 30, t0 = performance.now(), D = 1000;
      ring.style.opacity = "1";
      (function frame(now) {
        const k = Math.min((now - t0) / D, 1), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2, r = e * R;
        const m = "radial-gradient(circle at 50% 50%, transparent " + r + "px, #000 " + (r + 2) + "px)";
        el.style.webkitMaskImage = m; el.style.maskImage = m;
        ring.style.width = ring.style.height = (r * 2) + "px";
        ring.style.opacity = String(1 - k * k);
        if (k < 1) requestAnimationFrame(frame);
        else { el.remove(); ring.remove(); introOn = false; focusFirst(); }
      })(t0);
    }
    const onKey = e => { if (e.key === "Escape" || e.key === "Enter" || e.key === " ") reveal(); };
    el.addEventListener("click", reveal);
    document.addEventListener("keydown", onKey);
    setTimeout(reveal, 3100);
  }

  /* ---------- open / close the gate, the page behind it ---------- */
  function startMode() { const d = A.device(); return d && d.pin ? "pin" : "login"; }
  function openGate(m, o) {
    opts = o || {};
    gate.hidden = false; gate.classList.remove("out");
    setMode(m, false);
  }
  function closeGate() {
    gate.classList.add("out");
    renderApp();
    setTimeout(() => { if (gate.classList.contains("out")) gate.hidden = true; }, 700);
  }
  function renderApp() {
    const a = A.account();
    $("#who").textContent = a ? "帳號：" + a.username : "只用這台裝置";
    $("#pinBtn").hidden = !a;
    $("#accountBtn").textContent = a ? "登出" : "登入";
  }
  $("#pinBtn").addEventListener("click", () => openGate("setpin", { change: true }));
  $("#accountBtn").addEventListener("click", async () => {
    if (A.account()) await A.signOut();
    try { sessionStorage.removeItem("twgate-skip"); } catch (e) {}
    renderApp();
    openGate(startMode());
  });

  /* start: signed in in this tab (or skipped) → straight to the page; otherwise the gate */
  let skipped = false;
  try { skipped = sessionStorage.getItem("twgate-skip") === "1"; } catch (e) {}
  renderApp();
  if (A.account() || skipped) gate.hidden = true;
  else {
    /* the intro plays every time the sign-in is about to show (a new tab, a signed-out reload); not in automated browsers unless ?intro=1 */
    const robot = navigator.webdriver && !/[?&]intro=1/.test(location.search);
    if (!reduced && !robot) { introOn = true; gate.classList.add("hold"); }
    openGate(startMode());
    if (introOn) playIntro();
  }
})();
</script>
</body>
