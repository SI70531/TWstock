<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>TWstock 台股研究</title>
  <style>
    /* Emerald Depth */
    :root {
      --c0: #051F20; --c1: #0B2B26; --c2: #163832; --c3: #235347; --c4: #8EB69B; --c5: #DAF1DE;
      --err: #F0A8A0;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--c5); font: 16px/1.5 system-ui, -apple-system, "Noto Sans TC", sans-serif;
      background: radial-gradient(900px 500px at 15% -10%, rgba(35,83,71,.55), transparent 70%), var(--c0);
      min-height: 100vh;
    }
    main { max-width: 760px; margin: 0 auto; padding: 16px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0 16px; }
    h1 { font-size: 22px; margin: 0; letter-spacing: .02em; }
    h2 { font-size: 17px; margin: 0 0 8px; }
    .small { color: var(--c4); font-size: 14px; }
    button, input { font: inherit; }
    .btn {
      min-height: 40px; padding: 0 16px; border: 1px solid var(--c3); border-radius: 10px;
      background: var(--c2); color: var(--c5); cursor: pointer; transition: background .2s, transform .15s, border-color .2s;
    }
    .btn:hover { background: var(--c3); }
    .btn:active { transform: scale(.97); }
    .btn.primary { background: var(--c4); border-color: var(--c4); color: var(--c0); font-weight: 600; }
    .btn.primary:hover { background: var(--c5); border-color: var(--c5); }
    .btn:disabled { opacity: .5; cursor: default; }
    :focus-visible { outline: 2px solid var(--c4); outline-offset: 2px; }
    .card { background: var(--c1); border: 1px solid var(--c2); border-radius: 16px; padding: 18px; margin-bottom: 14px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input[type="text"], input[type="password"] {
      min-height: 42px; padding: 0 12px; border: 1px solid var(--c3); border-radius: 10px;
      background: var(--c0); color: var(--c5); min-width: 0; transition: border-color .2s, box-shadow .2s;
    }
    input::placeholder { color: rgba(142,182,155,.6); }
    input[type="text"]:focus, input[type="password"]:focus { outline: none; border-color: var(--c4); box-shadow: 0 0 0 3px rgba(142,182,155,.2); }
    .list { list-style: none; padding: 0; margin: 0; }
    .list li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--c2); }
    .list li:first-child { border-top: 0; }
    .code { font-family: ui-monospace, Menlo, monospace; font-weight: 600; color: var(--c5); }
    .price { color: var(--c4); font-size: 14px; }
    .status { font-size: 14px; color: var(--c4); min-height: 1.4em; }
    .status[data-state="err"] { color: var(--err); }
    .status[data-state="sync"] { opacity: .75; }
    .err { color: var(--err); font-size: 14px; min-height: 1.3em; margin: 4px 0 0; }

    /* ---------- sign-in card (dialog) ---------- */
    dialog {
      position: fixed; border: 1px solid var(--c3); border-radius: 22px; color: var(--c5);
      width: min(92vw, 400px); padding: 28px 24px 22px; overflow: hidden;
      background:
        radial-gradient(260px circle at var(--mx, 50%) var(--my, 0%), rgba(142,182,155,.17), transparent 70%),
        var(--c1);
      box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(142,182,155,.05) inset;
      transition: box-shadow .6s ease, border-color .6s ease;
    }
    dialog[open] { animation: cardIn .38s cubic-bezier(.2,.8,.2,1); }
    dialog::backdrop { background: rgba(5,31,32,.72); backdrop-filter: blur(6px); }
    /* fine grain over the card */
    dialog::after {
      content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .07; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }
    dialog[data-glow="1"] { border-color: var(--c4); box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 60px rgba(142,182,155,.35); }
    dialog.shake { animation: shake .45s; }
    dialog .head { text-align: center; margin-bottom: 18px; }
    dialog .head h2 { font-size: 21px; margin: 0 0 4px; }
    dialog .head p { margin: 0; color: var(--c4); font-size: 14px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 14px; background: var(--c0); border-radius: 12px; padding: 4px; }
    .tabs button { flex: 1; min-height: 36px; border: 0; border-radius: 9px; background: transparent; color: var(--c4); cursor: pointer; transition: background .25s, color .25s; }
    .tabs button[aria-selected="true"] { background: var(--c3); color: var(--c5); }
    .stack { display: flex; flex-direction: column; gap: 12px; }
    .stack label { display: flex; flex-direction: column; gap: 5px; font-size: 14px; color: var(--c4); }
    .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
    .actions.split { justify-content: space-between; }

    /* the four PIN boxes */
    .otp { display: flex; gap: 10px; justify-content: center; margin: 6px 0 4px; }
    .box {
      width: 56px; height: 66px; text-align: center; font-size: 28px; font-weight: 600; color: var(--c5);
      background: var(--c0); border: 1px solid var(--c3); border-radius: 14px; caret-color: var(--c4);
      transition: border-color .2s, box-shadow .2s, transform .2s, background .2s;
    }
    .box:focus { outline: none; border-color: var(--c4); box-shadow: 0 0 0 4px rgba(142,182,155,.2); transform: translateY(-2px); }
    .box.filled { border-color: var(--c4); background: var(--c2); animation: pop .22s ease-out; }
    .box.scatter { animation: scatter .55s cubic-bezier(.5,0,.8,.4) forwards; }

    /* verifying → granted, laid over the card */
    .overlay {
      position: absolute; inset: 0; z-index: 2; display: none; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px; text-align: center; padding: 24px; background: var(--c1);
    }
    .overlay[data-stage] { display: flex; animation: fade .3s ease-out; }
    .overlay h2 { font-size: 21px; margin: 6px 0 0; }
    .overlay p { margin: 0; color: var(--c4); font-size: 14px; }
    .overlay .verify, .overlay .done { display: none; flex-direction: column; align-items: center; gap: 6px; }
    .overlay[data-stage="verify"] .verify { display: flex; }
    .overlay[data-stage="done"] .done { display: flex; }
    .ring { position: relative; width: 104px; height: 104px; margin-bottom: 8px; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring .track { fill: none; stroke: var(--c2); stroke-width: 6; }
    .ring .arc { fill: none; stroke: var(--c4); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 264; stroke-dashoffset: 264; filter: drop-shadow(0 0 6px rgba(142,182,155,.6)); }
    .ring .pct { position: absolute; inset: 0; display: grid; place-items: center; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .check { width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 8px;
      background: radial-gradient(circle, var(--c3), var(--c2)); box-shadow: 0 0 0 8px rgba(142,182,155,.12), 0 0 40px rgba(142,182,155,.45); animation: checkPop .5s cubic-bezier(.2,1.4,.4,1); }
    .check svg { width: 46px; height: 46px; fill: none; stroke: var(--c5); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .45s .2s ease-out forwards; }
    .badge { margin-top: 8px; padding: 3px 14px; border-radius: 999px; background: var(--c4); color: var(--c0); font-size: 12px; font-weight: 700; letter-spacing: .12em; }

    @keyframes cardIn { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pop { 0% { transform: scale(.85); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }
    @keyframes scatter {
      0% { transform: none; opacity: 1; }
      35% { transform: translate(calc(var(--dx) * .5), calc(var(--dy) * .5 - 14px)) rotate(calc(var(--rot) * .5)); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(.85); opacity: 0; }
    }
    @keyframes shake { 0%,100% { transform: none; } 20% { transform: translateX(-9px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
    @keyframes checkPop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
      .check svg { stroke-dashoffset: 0; }
    }
    @media (max-width: 480px) {
      header { flex-direction: column; align-items: flex-start; }
      .box { width: 52px; height: 62px; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>TWstock 台股研究</h1>
      <div class="small">自選股</div>
    </div>
    <div class="row">
      <span id="who" class="small"></span>
      <button class="btn" id="accountBtn" type="button">登入</button>
    </div>
  </header>

  <section class="card" aria-labelledby="wlTitle">
    <div class="row" style="justify-content: space-between; margin-bottom: 10px;">
      <h2 id="wlTitle">自選股</h2>
      <span id="status" class="status" role="status"></span>
    </div>
    <form id="addForm" class="row" autocomplete="off">
      <input id="symbol" type="text" inputmode="numeric" maxlength="8" placeholder="股票代號，例如 2330" aria-label="股票代號" style="flex: 1 1 160px;">
      <button class="btn primary" type="submit">加入</button>
    </form>
    <p id="formErr" class="err" role="alert"></p>
    <ul id="list" class="list" aria-live="polite"></ul>
    <p id="empty" class="small" hidden>還沒有自選股，輸入代號加入。</p>
    <p class="small" style="margin-top: 12px;">報價與財務資料尚未接上，目前只顯示代號與名稱。</p>
  </section>
</main>

<!-- shared markup of the verifying / granted overlay (copied into each dialog by the script) -->
<template id="overlayTpl">
  <div class="overlay" role="status" aria-live="polite">
    <div class="verify">
      <div class="ring">
        <svg viewBox="0 0 104 104" aria-hidden="true"><circle class="track" cx="52" cy="52" r="42"/><circle class="arc" cx="52" cy="52" r="42"/></svg>
        <div class="pct">0</div>
      </div>
      <h2 class="v-title"></h2>
      <p class="v-sub"></p>
    </div>
    <div class="done">
      <div class="check"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M12 25 l9 9 l16 -19"/></svg></div>
      <h2 class="d-title"></h2>
      <p class="d-sub"></p>
      <span class="badge">已驗證</span>
    </div>
  </div>
</template>

<!-- sign in / sign up -->
<dialog id="authDlg" aria-labelledby="authTitle">
  <div class="head"><h2 id="authTitle">登入</h2><p id="authSub">用帳號和密碼登入，自選股會跟著帳號走</p></div>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tabLogin" aria-selected="true">登入</button>
    <button type="button" role="tab" id="tabReg" aria-selected="false">註冊</button>
  </div>
  <form id="authForm" class="stack">
    <label>帳號（英文、數字、底線，最多 20 字）
      <input id="authUser" type="text" autocomplete="username" required maxlength="20">
    </label>
    <label>密碼（至少 6 字）
      <input id="authPass" type="password" autocomplete="current-password" required minlength="6">
    </label>
    <p id="authErr" class="err" role="alert"></p>
    <div class="actions">
      <button class="btn" type="button" data-close>取消</button>
      <button class="btn primary" id="authSubmit" type="submit">登入</button>
    </div>
  </form>
</dialog>

<!-- optional: remember a PIN on this device -->
<dialog id="pinSetDlg" aria-labelledby="pinSetTitle">
  <div class="head"><h2 id="pinSetTitle">設定這台裝置的 PIN</h2><p>之後用 4 位數 PIN 就能登入，只對這台裝置有效</p></div>
  <form id="pinSetForm" class="stack">
    <div class="otp" id="pinSetOtp">
      <input class="box" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="PIN 第 1 碼">
      <input class="box" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="PIN 第 2 碼">
      <input class="box" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="PIN 第 3 碼">
      <input class="box" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="PIN 第 4 碼">
    </div>
    <p id="pinSetErr" class="err" role="alert" style="text-align:center"></p>
    <div class="actions">
      <button class="btn" type="button" data-close>之後再說</button>
      <button class="btn primary" type="submit">設定</button>
    </div>
  </form>
</dialog>

<!-- PIN sign-in on a device that has one -->
<dialog id="pinLoginDlg" aria-labelledby="pinLoginTitle">
  <div class="head"><h2 id="pinLoginTitle">輸入 PIN</h2><p>輸入這台裝置的 4 位數 PIN 登入</p></div>
  <div class="stack">
    <div class="otp" id="pinLoginOtp">
      <input class="box" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="PIN 第 1 碼">
      <input class="box" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="PIN 第 2 碼">
      <input class="box" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="PIN 第 3 碼">
      <input class="box" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="PIN 第 4 碼">
    </div>
    <p id="pinLoginErr" class="err" role="alert" style="text-align:center"></p>
    <div class="actions split">
      <button class="btn" type="button" id="usePassword">改用帳號和密碼</button>
      <button class="btn" type="button" data-close>略過</button>
    </div>
  </div>
</dialog>

<script src="./assets/twaccount.js"></script>
<script>
(function () {
  const A = window.TWAccount;
  const NAMES = {
    "2330": "台積電", "2317": "鴻海", "2454": "聯發科", "2412": "中華電", "2881": "富邦金",
    "2882": "國泰金", "2603": "長榮", "0050": "元大台灣50",
  };
  const $ = id => document.getElementById(id);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let symbols = [];

  /* ---------- watchlist ---------- */
  function setStatus(text, state) {
    const s = $("status");
    s.textContent = text || "";
    s.dataset.state = state || "";
  }

  function render() {
    const list = $("list");
    list.innerHTML = "";
    $("empty").hidden = symbols.length > 0;
    symbols.forEach(code => {
      const li = document.createElement("li");
      const left = document.createElement("div");
      const c = document.createElement("span");
      c.className = "code";
      c.textContent = code;
      const n = document.createElement("span");
      n.textContent = " " + (NAMES[code] || "");
      left.append(c, n);
      const p = document.createElement("div");
      p.className = "price";
      p.textContent = "報價待接上";
      const btn = document.createElement("button");
      btn.className = "btn";
      btn.type = "button";
      btn.textContent = "移除";
      btn.setAttribute("aria-label", "移除 " + code);
      btn.addEventListener("click", () => update(symbols.filter(x => x !== code)));
      const right = document.createElement("div");
      right.className = "row";
      right.append(p, btn);
      li.append(left, right);
      list.append(li);
    });
  }

  /* the list is saved on this browser first, so a failed upload keeps the change here and says so */
  async function update(next) {
    symbols = next;
    render();
    setStatus("儲存中…", "sync");
    try {
      symbols = await A.saveWatchlist(next);
      render();
      setStatus(A.account() ? "已同步到帳號" : "已存在這台裝置", "ok");
    } catch (e) {
      render();
      setStatus(A.errMsg(e), "err");
    }
  }

  function renderAccount() {
    const a = A.account();
    $("accountBtn").textContent = a ? "登出" : "登入";
    $("who").textContent = a ? "帳號：" + a.username : "";
  }

  async function loadAll() {
    setStatus("同步中…", "sync");
    try {
      symbols = await A.loadWatchlist();
      setStatus(A.account() ? "已同步" : "只存在這台裝置", A.account() ? "ok" : "");
    } catch (e) {
      try { symbols = JSON.parse(localStorage.getItem("twstock-watch") || "null").symbols || []; } catch (x) { symbols = []; }
      setStatus(A.errMsg(e), "err");
    }
    render();
    renderAccount();
  }

  /* ---------- card effects: light that follows the pointer, shake, verify → granted ---------- */
  const tpl = $("overlayTpl");
  document.querySelectorAll("dialog").forEach(dlg => {
    dlg.appendChild(tpl.content.cloneNode(true));
    dlg.addEventListener("pointermove", e => {
      const r = dlg.getBoundingClientRect();
      dlg.style.setProperty("--mx", (e.clientX - r.left) + "px");
      dlg.style.setProperty("--my", (e.clientY - r.top) + "px");
    });
    dlg.addEventListener("cancel", e => { if (dlg.dataset.busy) e.preventDefault(); });
    dlg.addEventListener("close", () => {
      const ov = dlg.querySelector(".overlay");
      delete ov.dataset.stage;
      delete dlg.dataset.glow;
    });
  });
  document.querySelectorAll("[data-close]").forEach(b =>
    b.addEventListener("click", () => b.closest("dialog").close()));

  function shake(dlg) {
    dlg.classList.remove("shake");
    void dlg.offsetWidth;
    dlg.classList.add("shake");
  }

  const LABELS = {
    login:    { verify: ["驗證中…", "正在安全地確認你的身分"], done: ["登入成功", "歡迎回來，正在載入自選股"] },
    register: { verify: ["建立帳號中…", "請稍候"],           done: ["註冊成功", "已為你登入"] },
    pinset:   { verify: ["設定中…", "正在記住這台裝置"],       done: ["PIN 已設定", "下次用 PIN 就能登入"] },
  };

  /* shows the progress ring while fn() runs, then the check mark; rethrows if fn fails (the card shakes) */
  async function withVerify(dlg, labels, fn) {
    const ov = dlg.querySelector(".overlay");
    const arc = ov.querySelector(".arc"), pct = ov.querySelector(".pct");
    ov.querySelector(".v-title").textContent = labels.verify[0];
    ov.querySelector(".v-sub").textContent = labels.verify[1];
    ov.querySelector(".d-title").textContent = labels.done[0];
    ov.querySelector(".d-sub").textContent = labels.done[1];
    const setPct = p => { pct.textContent = Math.round(p); arc.style.strokeDashoffset = 264 * (1 - p / 100); };
    dlg.dataset.busy = "1";
    ov.dataset.stage = "verify";
    let p = 0, target = 88, k = 0.05, running = true;
    setPct(0);
    (function tick() {
      if (!running) return;
      p += (target - p) * k;
      setPct(p);
      requestAnimationFrame(tick);
    })();
    try {
      const res = await fn();
      target = 100; k = 0.22;                       /* the request is back: run the ring up to 100 */
      const t0 = performance.now();
      while (p < 99.4 && performance.now() - t0 < 1000) await new Promise(requestAnimationFrame);
      running = false;
      setPct(100);
      ov.dataset.stage = "done";
      dlg.dataset.glow = "1";
      await sleep(reduced ? 500 : 1000);
      delete dlg.dataset.busy;
      dlg.close();
      return res;
    } catch (err) {
      running = false;
      delete ov.dataset.stage;
      delete dlg.dataset.busy;
      shake(dlg);
      throw err;
    }
  }

  /* ---------- the four PIN boxes ---------- */
  function makeOtp(root, onComplete) {
    const boxes = [...root.querySelectorAll(".box")];
    const val = () => boxes.map(b => b.value).join("");
    const fill = (i, c) => { boxes[i].value = c; boxes[i].classList.toggle("filled", !!c); };
    boxes.forEach((b, i) => {
      b.addEventListener("input", () => {
        fill(i, b.value.replace(/\D/g, "").slice(-1));
        if (b.value && i < 3) boxes[i + 1].focus();
        if (val().length === 4 && onComplete) onComplete(val());
      });
      b.addEventListener("keydown", e => {
        if (e.key === "Backspace" && !b.value && i > 0) { e.preventDefault(); fill(i - 1, ""); boxes[i - 1].focus(); }
        else if (e.key === "ArrowLeft" && i > 0) boxes[i - 1].focus();
        else if (e.key === "ArrowRight" && i < 3) boxes[i + 1].focus();
      });
      b.addEventListener("paste", e => {
        const t = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 4);
        if (!t) return;
        e.preventDefault();
        [...t].forEach((c, k) => fill(k, c));
        boxes[Math.min(t.length, 3)].focus();
        if (t.length === 4 && onComplete) onComplete(t);
      });
      b.addEventListener("focus", () => b.select());
    });
    return {
      val,
      reset() {
        boxes.forEach((b, i) => { fill(i, ""); b.classList.remove("scatter"); });
        boxes[0].focus();
      },
      /* the digits tumble away in random directions */
      scatter() {
        boxes.forEach(b => {
          b.style.setProperty("--dx", (Math.random() * 170 - 85).toFixed(0) + "px");
          b.style.setProperty("--dy", (Math.random() * 150 - 75).toFixed(0) + "px");
          b.style.setProperty("--rot", (Math.random() * 90 - 45).toFixed(0) + "deg");
          b.classList.add("scatter");
        });
      },
    };
  }

  /* ---------- sign in / up ---------- */
  let mode = "login";
  function setMode(m) {
    mode = m;
    $("tabLogin").setAttribute("aria-selected", m === "login");
    $("tabReg").setAttribute("aria-selected", m === "register");
    $("authSubmit").textContent = m === "login" ? "登入" : "註冊";
    $("authTitle").textContent = m === "login" ? "登入" : "建立帳號";
    $("authSub").textContent = m === "login" ? "用帳號和密碼登入，自選股會跟著帳號走" : "只需要帳號和密碼，不用 Email";
    $("authPass").autocomplete = m === "login" ? "current-password" : "new-password";
    $("authErr").textContent = "";
  }
  function openAuth(m) {
    setMode(m || "login");
    $("authForm").reset();
    $("authDlg").showModal();
    $("authUser").focus();
  }
  $("tabLogin").addEventListener("click", () => setMode("login"));
  $("tabReg").addEventListener("click", () => setMode("register"));

  $("authForm").addEventListener("submit", async e => {
    e.preventDefault();
    $("authErr").textContent = "";
    const user = $("authUser").value, pass = $("authPass").value;
    try {
      await withVerify($("authDlg"), mode === "login" ? LABELS.login : LABELS.register,
        () => mode === "register" ? A.signUp(user, pass) : A.signIn(user, pass));
    } catch (err) {
      $("authErr").textContent = A.errMsg(err);
      return;
    }
    await loadAll();
    if (A.device() && !A.device().pin) openPinSet();
  });

  /* ---------- device PIN ---------- */
  const setOtp = makeOtp($("pinSetOtp"));
  function openPinSet() {
    $("pinSetErr").textContent = "";
    $("pinSetDlg").showModal();
    setOtp.reset();
  }
  $("pinSetForm").addEventListener("submit", async e => {
    e.preventDefault();
    $("pinSetErr").textContent = "";
    const pin = setOtp.val();
    if (pin.length !== 4) { $("pinSetErr").textContent = "請輸入 4 位數字。"; shake($("pinSetDlg")); return; }
    try {
      await withVerify($("pinSetDlg"), LABELS.pinset, () => A.setPin(pin));
      setStatus("已設定這台裝置的 PIN", "ok");
    } catch (err) {
      $("pinSetErr").textContent = A.errMsg(err);
      setOtp.reset();
    }
  });

  let pinBusy = false;
  const loginOtp = makeOtp($("pinLoginOtp"), async pin => {
    if (pinBusy) return;
    pinBusy = true;
    $("pinLoginErr").textContent = "";
    const dlg = $("pinLoginDlg");
    try {
      if (!reduced) { loginOtp.scatter(); await sleep(560); }
      await withVerify(dlg, LABELS.login, () => A.pinLogin(pin));
      await loadAll();
    } catch (err) {
      loginOtp.reset();
      $("pinLoginErr").textContent = A.errMsg(err);
      if (err.code === "nopin" || err.code === "pinlocked") {
        await sleep(900);
        dlg.close();
        openAuth("login");
      }
    } finally {
      pinBusy = false;
    }
  });
  function openPinLogin() {
    $("pinLoginErr").textContent = "";
    $("pinLoginDlg").showModal();
    loginOtp.reset();
  }
  $("usePassword").addEventListener("click", () => {
    $("pinLoginDlg").close();
    openAuth("login");
  });

  $("accountBtn").addEventListener("click", async () => {
    if (A.account()) {
      await A.signOut();
      await loadAll();
      setStatus("已登出，自選股只存在這台裝置", "");
    } else {
      openAuth("login");
    }
  });

  /* ---------- add a code ---------- */
  $("addForm").addEventListener("submit", e => {
    e.preventDefault();
    const code = $("symbol").value.trim().toUpperCase();
    $("formErr").textContent = "";
    if (!/^\d{4,5}[A-Z]?$/.test(code)) {
      $("formErr").textContent = "請輸入台股代號，例如 2330 或 0050。";
      return;
    }
    if (symbols.includes(code)) {
      $("formErr").textContent = code + " 已經在清單裡了。";
      return;
    }
    $("symbol").value = "";
    update([...symbols, code]);
  });

  /* on load: a device with a PIN and no sign-in asks for the PIN first */
  loadAll().then(() => {
    if (!A.account() && A.device() && A.device().pin) openPinLogin();
  });
})();
</script>
</body>
</html>
