<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <script>
    /* light / dark: the saved choice (or the device setting) is applied before anything paints, so nothing flashes */
    (function () {
      var r = document.documentElement, m = null;
      try { m = localStorage.getItem("twstock-theme"); } catch (e) {}
      if (m !== "light" && m !== "dark") m = null;
      var q = matchMedia("(prefers-color-scheme: light)");
      function eff() { return m || (q.matches ? "light" : "dark"); }
      r.dataset.theme = eff(); r.classList.add("js");
      window.__twTheme = {
        get mode() { return m || "system"; },
        set: function (x) {
          m = x === "light" || x === "dark" ? x : null;
          try { m ? localStorage.setItem("twstock-theme", m) : localStorage.removeItem("twstock-theme"); } catch (e) {}
          r.dataset.theme = eff();
        },
      };
      if (q.addEventListener) q.addEventListener("change", function () { if (!m) r.dataset.theme = eff(); });
    })();
  </script>
  <title>TWstock 台股研究</title>
  <meta name="description" content="台股研究：證交所公開資料的大盤與個股行情、自選股、K 線與指標、新聞與 AI 分析團隊。">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- the same fonts as EZexams (self-hosted there, same site): Source Serif 4 for English, LXGW WenKai TC (霞鶩文楷) for Chinese -->
  <link rel="stylesheet" href="https://si70531.github.io/EZexams/assets/fonts/fonts.css">

  <link rel="stylesheet" href="./assets/twui.css?v=20261127q">
  <link rel="stylesheet" href="./assets/twpulse.css?v=20261127q">
  <link rel="stylesheet" href="./assets/twplay.css?v=20261127q">
</head>

<!-- light / dark -->
<div class="theme" id="theme">
  <button class="themebtn" id="themeBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="外觀：深色或淺色" title="外觀">
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
  <div class="thmenu" id="themeMenu" role="menu" hidden>
    <button type="button" role="menuitemradio" data-t="system">跟隨裝置</button>
    <button type="button" role="menuitemradio" data-t="light">淺色</button>
    <button type="button" role="menuitemradio" data-t="dark">深色</button>
  </div>
</div>

<!-- the page -->

  <main class="dashmain">
    <section class="dash" id="dash" aria-label="大盤儀表板">
      <div class="dash-note"><b>載入中</b>正在讀取證交所公開資料…</div>
