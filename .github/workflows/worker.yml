# Deploys the TWstock Worker (tools/twstock-worker.js + tools/wrangler.toml) to Cloudflare as "twstock-ai".
# Repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and TELEGRAM_BOT_TOKEN for the pre-market notification.
name: Deploy Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/twstock-worker.js", "tools/worker/**", "tools/wrangler.toml", ".github/workflows/worker.yml"]
jobs:
  deploy:
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Worker tests
        run: node tests/worker.test.mjs
      - name: Skip when Cloudflare is not set up yet
        if: env.HAS_TOKEN != 'true'
        run: echo "Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy the Worker."
      - name: Store the Telegram bot token
        if: env.HAS_TOKEN == 'true' && env.TG_TOKEN != ''
        working-directory: tools
        run: printf '%s' "$TG_TOKEN" | npx --yes wrangler@4 secret put TG_TOKEN
      - name: Deploy with Wrangler
        if: env.HAS_TOKEN == 'true'
        working-directory: tools
        run: npx --yes wrangler@4 deploy
