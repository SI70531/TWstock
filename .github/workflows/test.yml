# Walks the site with mocked market data on every change to the page.
name: Smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index.html", "assets/**", "sw.js", "tests/**", "tools/**", ".github/workflows/test.yml"]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python tests/smoke.py

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node tests/worker.test.mjs
      - name: No undefined names in the Worker modules
        run: |
          npm i --no-save eslint@9 globals
          printf 'import globals from "globals";\nexport default [{ files: ["**/*.js"], languageOptions: { ecmaVersion: 2024, sourceType: "module", globals: { ...globals.serviceworker } }, rules: { "no-undef": "error" } }];\n' > eslint.config.mjs
          npx eslint tools/twstock-worker.js tools/worker/*.js
