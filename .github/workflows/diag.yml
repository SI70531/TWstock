name: Diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36"
          Y="https://tw.stock.yahoo.com/_td-stock/api/resource"
          echo "== auto 金融類"; curl -s -m 20 -A "$UA" "$Y/AutocompleteService;query=%E9%87%91%E8%9E%8D%E9%A1%9E" | head -c 500; echo
          echo "== auto 金融"; curl -s -m 20 -A "$UA" "$Y/AutocompleteService;query=%E9%87%91%E8%9E%8D" | head -c 900; echo
          echo "== tick TELI full"; curl -s -m 20 -A "$UA" "$Y/FinanceChartService.ApacLibraCharts;symbols=%5B%22%5ETELI%22%5D;type=tick" | python3 -c "import json,sys; d=json.load(sys.stdin)[0]['chart']; print(list(d.keys())); print({k:(v if not isinstance(v,(list,dict)) else (str(v)[:300])) for k,v in d.items() if k!='meta'})"
          echo "== day TWII"; curl -s -m 20 -A "$UA" "$Y/FinanceChartService.ApacLibraCharts;symbols=%5B%22%5ETWII%22%5D;type=day;period=d" | python3 -c "import json,sys; d=json.load(sys.stdin)[0]['chart']; print(len(d.get('timestamp',[])), str(d.get('indicators'))[:200])"
          echo "== tick WTX len"; curl -s -m 20 -A "$UA" "$Y/FinanceChartService.ApacLibraCharts;symbols=%5B%22WTX%26%22%5D;type=tick" | python3 -c "import json,sys; d=json.load(sys.stdin)[0]['chart']; t=d.get('timestamp',[]); print(len(t), t[:2], t[-2:])"
